<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuarios - PedidosPro</title>
    <link rel="stylesheet" href="../style/style.css" />
</head>

<body>
    <header class="header">
        <div class="brand">
            <h1>PedidosPro</h1>
            <p>Módulo de usuarios</p>
        </div>
        <nav class="nav">
            <a href="../index.html">Inicio</a>
            <a href="clientes.html">Clientes</a>
            <a href="pedidos.html">Pedidos</a>
            <a href="usuarios.html" class="active">Usuarios</a>
        </nav>
    </header>

    <main class="container">
        <section class="section-title">
            <div>
                <p class="eyebrow">Módulo usuarios</p>
                <h2>Usuarios del sistema</h2>
            </div>
            <a class="btn btn-primary" href="#nuevo-usuario">Nuevo usuario</a>
        </section>

        <section class="panel">
            <form id="usuario-form" class="form-card">
                <h3 id="nuevo-usuario">Crear usuario</h3>
                <input type="text" id="usuario-nombre" placeholder="Nombre completo" required />
                <input type="email" id="usuario-email" placeholder="Correo" required />
                <select id="usuario-rol">
                    <option value="Admin">Admin</option>
                    <option value="Vendedor">Vendedor</option>
                    <option value="Soporte">Soporte</option>
                </select>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>

            <div class="list-card">
                <h3>Personal activo</h3>
                <div id="usuarios-list" class="cards-stack"></div>
            </div>
        </section>
    </main>

    <script src="../js/app.js"></script>
</body>

</html>
