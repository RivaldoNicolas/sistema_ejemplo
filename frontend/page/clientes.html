<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clientes - PedidosPro</title>
    <link rel="stylesheet" href="../style/style.css" />
</head>

<body>
    <header class="header">
        <div class="brand">
            <h1>PedidosPro</h1>
            <p>Módulo de clientes</p>
        </div>
        <nav class="nav">
            <a href="../index.html">Inicio</a>
            <a href="clientes.html" class="active">Clientes</a>
            <a href="pedidos.html">Pedidos</a>
            <a href="usuarios.html">Usuarios</a>
        </nav>
    </header>

    <main class="container">
        <section class="section-title">
            <div>
                <p class="eyebrow">Módulo cliente</p>
                <h2>Listado de clientes</h2>
            </div>
            <a class="btn btn-primary" href="#nuevo-cliente">Agregar cliente</a>
        </section>

        <section class="panel">
            <form id="cliente-form" class="form-card">
                <h3 id="nuevo-cliente">Registrar cliente</h3>
                <input type="text" id="cliente-nombre" placeholder="Nombre" required />
                <input type="email" id="cliente-email" placeholder="Correo" required />
                <input type="text" id="cliente-telefono" placeholder="Teléfono" required />
                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>

            <div class="list-card">
                <h3>Clientes recientes</h3>
                <div id="clientes-list" class="cards-stack"></div>
            </div>
        </section>
    </main>

    <script src="../js/app.js"></script>
</body>

</html>
