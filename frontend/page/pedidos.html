<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedidos - PedidosPro</title>
    <link rel="stylesheet" href="../style/style.css" />
</head>

<body>
    <header class="header">
        <div class="brand">
            <h1>PedidosPro</h1>
            <p>Módulo de pedidos</p>
        </div>
        <nav class="nav">
            <a href="../index.html">Inicio</a>
            <a href="clientes.html">Clientes</a>
            <a href="pedidos.html" class="active">Pedidos</a>
            <a href="usuarios.html">Usuarios</a>
        </nav>
    </header>

    <main class="container">
        <section class="section-title">
            <div>
                <p class="eyebrow">Módulo pedidos</p>
                <h2>Gestión de órdenes</h2>
            </div>
            <div class="chip">Total hoy: $1,250.00</div>
        </section>

        <section class="panel">
            <div class="list-card" style="width: 100%;">
                <h3>Últimos pedidos</h3>
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="pedidos-list"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="../js/app.js"></script>
</body>

</html>
